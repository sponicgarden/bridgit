# Deploys bridgit.cc from main. Needs the CLOUDFLARE_API_TOKEN repository secret.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and run wrangler deploy --dry-run only
        type: boolean
        default: true

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9cd3a280a54ce2a5b382602f0247b577
    steps:
      # Full history: the version stamp counts that day's commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global wrangler@4.122.0
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm run deploy:check
      - name: Deploy
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm run deploy
